<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Aivaro 对话型首页：打开就是对话，发送时前往工作台登录。受控试运行，账号由管理员开通。">
<title>Aivaro · 对话</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand-icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/brand-icon-180.png">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/liquid-selector.css">
<script src="assets/liquid-selector.js" defer></script>
<script src="assets/app-prod.js" defer></script>
</head>
<body>

<!-- 深空氛围层：定版方案 B 极光，工作台级 calm 强度（sky--dim） -->
<div class="sky sky--dim" aria-hidden="true">
  <span class="mist mist-a"></span><span class="mist mist-b"></span>
  <span class="stars"></span>
  <svg class="aurora" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMin slice" focusable="false">
    <defs>
      <filter id="ab80" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="58"/></filter>
      <filter id="ab60" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="42"/></filter>
    </defs>
    <g class="drift-b" filter="url(#ab80)" opacity=".07">
      <path d="M-140,470 C280,360 640,560 980,430 C1210,345 1400,420 1600,320" fill="none" stroke="#7B5FC7" stroke-width="150"/>
    </g>
    <g class="drift-a" filter="url(#ab60)" opacity=".08">
      <path d="M-120,335 C240,210 560,430 880,318 C1120,238 1330,300 1580,190" fill="none" stroke="#5B7FE0" stroke-width="105"/>
    </g>
  </svg>
</div>

<div class="ch-shell">

  <!-- 极简顶栏：品牌 + 二级文字链 + 登录态区 -->
  <header class="topbar">
    <div class="topbar-in">
      <a class="brandmark" href="index.html" aria-current="page"><img class="brand-icon" src="assets/brand-icon.png" alt="" width="32" height="32">Aivaro</a>
      <nav class="top-links" aria-label="二级页面">
        <a href="models.html">产品介绍</a>
        <a href="models.html">收费标准</a>
        <a href="docs.html">文档</a>
        <a href="status.html">状态</a>
        <a href="contact.html">联系</a>
      </nav>
      <div class="top-right">
        <button class="entry-btn" id="entryBtn" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="topSheet">
          <span class="entry-ico" id="entryIco" aria-hidden="true">☰</span>
          <span class="entry-avatar" id="entryAvatar" aria-hidden="true" hidden>演</span>
        </button>
      </div>
    </div>
    <div class="usage-line" aria-hidden="true"><span class="usage-line-fill" id="usageLineFill"></span></div>
    <div class="top-sheet glass" id="topSheet" hidden>
      <div class="sheet-guest" id="sheetGuest">
        <nav class="sheet-links" aria-label="二级页面">
          <a href="models.html">产品介绍</a>
          <a href="models.html">收费标准</a>
          <a href="docs.html">文档</a>
          <a href="status.html">状态</a>
          <a href="contact.html">联系</a>
        </nav>
        <button class="btn btn-primary sheet-login" id="loginOpenBtn" type="button">登录</button>
      </div>
    </div>
  </header>

  <!-- 中央对话列 -->
  <section class="messages" id="msgScroll" aria-label="对话消息">
    <div class="msg-col" id="msgCol">
      <div class="empty" id="emptyState">
        <h1>你好，我是 Aivaro</h1>
        <p class="sub">想问什么，直接打在下面。选好模型就能开始——发送时需要先登录，账号由管理员开通。</p>
        <p class="suggest-label">试试这些问题</p>
        <ul class="suggest">
          <li><button type="button" data-fill="帮我用一句话介绍 Aivaro"><span class="arr" aria-hidden="true">→</span>帮我用一句话介绍 Aivaro</button></li>
          <li><button type="button" data-fill="用 Python 写一个快速排序，并说明时间复杂度"><span class="arr" aria-hidden="true">→</span>用 Python 写一个快速排序，并说明时间复杂度</button></li>
          <li><button type="button" data-fill="额度是怎么预留、结算和退回的？"><span class="arr" aria-hidden="true">→</span>额度是怎么预留、结算和退回的？</button></li>
        </ul>
      </div>
    </div>
  </section>

  <!-- 底部输入区：玻璃面板（输入框 + 模型选择器 + 发送） -->
  <div class="ch-composer-zone">
    <form class="ch-composer glass" id="composerForm">
      <label class="sr" for="composerInput">输入消息</label>
      <textarea id="composerInput" rows="2" placeholder="输入消息，Enter 发送，Shift + Enter 换行"></textarea>
      <div class="ch-composer-row">
        <div class="model-pick">
          <div class="lg-track" id="modelTrack" role="radiogroup" aria-label="选择模型">
            <div class="lg-lens" aria-hidden="true"><div class="lg-row"></div></div>
            <button class="lg-seg" type="button" role="radio" aria-checked="true" tabindex="0" data-model="cohere" aria-label="模型 cohere/north-mini-code:free"><span class="seg-in"><span class="dot" style="--c:var(--m-cohere)" aria-hidden="true"></span><span class="lbl lbl-full">Cohere North Mini Code</span><span class="lbl lbl-short">Cohere</span></span></button>
            <button class="lg-seg" type="button" role="radio" aria-checked="false" tabindex="-1" data-model="deepseek" aria-label="模型 deepseek-flash"><span class="seg-in"><span class="dot" style="--c:var(--m-deepseek)" aria-hidden="true"></span><span class="lbl lbl-full">DeepSeek Flash</span><span class="lbl lbl-short">DeepSeek</span></span></button>
            <button class="lg-seg" type="button" role="radio" aria-checked="false" tabindex="-1" data-model="deepseek-none" aria-label="模型 deepseek-flash-none，非思考变体"><span class="seg-in"><span class="dot" style="--c:var(--m-deepseek-none)" aria-hidden="true"></span><span class="lbl lbl-full">DeepSeek Flash 免思考</span><span class="lbl lbl-short">DeepSeek 免思考</span></span></button>
          </div>
        </div>
        <button class="btn btn-primary" id="sendBtn" type="submit">发送</button>
      </div>
    </form>
    <p class="ch-hint proto-note">未登录时点发送将前往工作台登录，草稿会自动带过去；登录后由你点真发送。</p>
  </div>
</div>

<!-- 液态透镜折射滤镜：只作用于透镜内的克隆文字层，scale 很小；不支持的浏览器自动忽略，退化为纯放大+磨砂 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="lg-refract" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.09" numOctaves="2" seed="7" stitchTiles="stitch" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

</body>
</html>
