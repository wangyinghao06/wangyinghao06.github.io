<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>站长设备标记 · Aivaro</title>
<style>
  body { margin:0; background:#000; color:#fff; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width:560px; margin:12vh auto; padding:0 20px; }
  h1 { font-size:20px; font-weight:600; }
  p { color:#bbb; line-height:1.7; font-size:15px; }
  #status { color:#fff; border:1px solid #444; border-radius:8px; padding:12px 14px; margin:20px 0; font-size:15px; }
  button { background:#fff; color:#000; border:0; border-radius:8px; padding:10px 18px; font-size:15px; cursor:pointer; }
  button.ghost { background:transparent; color:#bbb; border:1px solid #444; margin-left:10px; }
</style>
</head>
<body>
<main>
  <h1>站长设备标记</h1>
  <p>本页用于把当前浏览器标记为站长设备：标记后，这台设备访问 Aivaro 的页面不再计入访问统计。打开本页即自动设置标记，每个浏览器只需打开一次。</p>
  <div id="status">正在设置标记……</div>
  <button id="setBtn" type="button">重新设置标记</button>
  <button id="removeBtn" type="button" class="ghost">取消标记（恢复统计）</button>
  <p>说明：标记只对当前浏览器生效（按浏览器、按站点保存）。换浏览器或换设备时，需要在新浏览器上再打开一次本页。</p>
</main>
<script>
  var statusEl = document.getElementById('status');
  function showStatus() {
    var v = null;
    try { v = localStorage.getItem('umami.disabled'); } catch (e) {}
    if (v) {
      statusEl.textContent = '标记状态：已生效。本设备访问本站不再计入统计。';
    } else {
      statusEl.textContent = '标记状态：未设置。若长时间停留在此状态，请检查浏览器是否禁用了本地存储。';
    }
  }
  function setFlag() {
    try { localStorage.setItem('umami.disabled', '1'); } catch (e) {}
    showStatus();
  }
  function removeFlag() {
    try { localStorage.removeItem('umami.disabled'); } catch (e) {}
    showStatus();
  }
  document.getElementById('setBtn').addEventListener('click', setFlag);
  document.getElementById('removeBtn').addEventListener('click', removeFlag);
  setFlag();
</script>
</body>
</html>
