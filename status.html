<style>
:root{
  --surface:#000000; --card:#131316; --ink:#F5F5F4; --ink-dim:rgba(245,245,244,.62);
  --line:rgba(245,245,244,.20); --line-soft:rgba(245,245,244,.10);
  --solid:#F5F5F4; --solid-ink:#000000;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--surface); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:48px 20px;
}
.wrap{width:100%; max-width:620px}
.brand{display:flex; align-items:center; gap:14px; margin-bottom:28px}
.brand img{width:52px; height:52px; display:block}
.brand .name{font-size:26px; font-weight:700; letter-spacing:.2px}
.brand .tag{margin-left:auto; font-size:12px; color:var(--ink-dim); border:1px solid var(--line); padding:5px 10px}
.panel{border:1px solid var(--line); background:var(--card); padding:40px 40px 34px}
h1{font-size:30px; font-weight:700; line-height:1.25; margin-bottom:18px}
p{font-size:16px; line-height:1.75; color:var(--ink-dim); margin-bottom:14px}
p strong{color:var(--ink); font-weight:600}
.statement{
  border:1px solid var(--line); border-left:3px solid var(--solid);
  padding:14px 18px; margin:22px 0 26px; font-size:16px; color:var(--ink); line-height:1.6;
}
.btn{
  display:inline-block; background:var(--solid); color:var(--solid-ink);
  font-size:15px; font-weight:600; text-decoration:none; padding:13px 22px; border:1px solid var(--solid);
}
.btn:hover{background:#DCDCDC}
.contact-note{font-size:13px; color:var(--ink-dim); margin-top:16px; line-height:1.7}
.foot{margin-top:26px; padding-top:18px; border-top:1px solid var(--line-soft);
  font-size:12px; color:var(--ink-dim); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}
@media (max-width:640px){
  body{padding:32px 16px; align-items:flex-start}
  .panel{padding:28px 22px 24px}
  h1{font-size:25px}
  .brand .name{font-size:23px}
  .brand img{width:44px; height:44px}
}
</style>
</head>
